      path: src/rules/**/*.ts
      scope: "Macro-related lint rules (hasMacroParentheses, hasMacroNameInMend, noNestedMacros, strictMacroDefinition, hasDoxygenHeader, hasRequiredMacroOptions)"
    - repo: https://github.com/sasjs/core
      tag: v4.63.0
      sha: 3a54b9c796c0bfe477d1aefc1e22b9ff9f2c96c2
      path: base/*.sas
