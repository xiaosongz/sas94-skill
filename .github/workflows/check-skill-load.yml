name: check-skill-load

# Asserts that SKILL.md parses as a valid Anthropic-skill manifest and
# that every reference file named in the routing table exists on disk.
# Also enforces the Phase 1 invariant of at least 11 reference files
# (now 13 after the T19 functions-reference split).

on:
  pull_request:
    paths:
      - 'plugins/sas94/skills/sas94/SKILL.md'
      - 'plugins/sas94/skills/sas94/references/**'
      - '.claude-plugin/marketplace.json'
      - 'plugins/sas94/.claude-plugin/plugin.json'
  push:
    branches: [main]
    paths:
      - 'plugins/sas94/skills/sas94/SKILL.md'
      - 'plugins/sas94/skills/sas94/references/**'
      - '.claude-plugin/marketplace.json'
      - 'plugins/sas94/.claude-plugin/plugin.json'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Parse SKILL.md and verify reference files
        run: |
          python3 <<'PY'
          import re
          import sys
          import yaml
          from pathlib import Path

          skill_path = Path('plugins/sas94/skills/sas94/SKILL.md')
          skill = skill_path.read_text(encoding='utf-8')
          m = re.match(r'---\n(.*?)\n---', skill, re.DOTALL)
          if not m:
              print(f'FAIL: {skill_path} missing YAML frontmatter')
              sys.exit(1)

          data = yaml.safe_load(m.group(1))
          for key in ('name', 'description'):
              if key not in data:
                  print(f'FAIL: {skill_path} frontmatter missing `{key}`')
                  sys.exit(1)

          # Atom paths are quoted in backticks in the routing table, e.g.
          # `references/base-procs/proc-freq.md`.
          atom_path_re = re.compile(r'`(references/[\w\-]+/[\w\-]+\.md)`')
          atoms_in_skill = set(atom_path_re.findall(skill))

          ref_dir = Path('plugins/sas94/skills/sas94/references')
          atoms_on_disk = {
              f'references/{p.parent.name}/{p.name}'
              for p in ref_dir.glob('*/*.md')
          }

          missing = atoms_in_skill - atoms_on_disk
          if missing:
              print(f'FAIL: SKILL.md references missing atoms: {sorted(missing)}')
              sys.exit(1)

          topic_dirs = {p.name for p in ref_dir.iterdir() if p.is_dir()}
          if len(topic_dirs) < 10:
              print(
                  f'FAIL: references/ has {len(topic_dirs)} topic dirs, '
                  'expected at least 10'
              )
              sys.exit(1)

          if len(atoms_on_disk) < 40:
              print(
                  f'FAIL: references/ has {len(atoms_on_disk)} atom files, '
                  'expected at least 40'
              )
              sys.exit(1)

          print(
              f'OK: SKILL.md frontmatter valid; '
              f'{len(topic_dirs)} topic dirs, {len(atoms_on_disk)} atoms on disk; '
              f'{len(atoms_in_skill)} atoms referenced in SKILL.md.'
          )
          PY
